<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniTrain Simulator V9.5 demo </title>
    <style>
        :root {
            --bg-dark: #080808;
            --sidebar-bg: #141414;
            --v15-color: #ff3e3e;
            --v5-color: #ffa502;
            --gnd-color: #1e90ff;
            --node-color: #202020;
            --comp-bg: #ffffff;
            --comp-border: #bbbbbb;
            --symbol-color: #000;
        }

        body { margin: 0; display: flex; height: 100vh; background: var(--bg-dark); color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        /* Sidebar & Menu */
        #sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 1000; overflow-y: auto; }
        .section-label { font-size: 10px; color: #666; text-transform: uppercase; margin-top: 10px; margin-bottom: 4px; letter-spacing: 1px; }
        .comp-btn { background: #252525; border: 1px solid #333; color: white; padding: 8px 12px; border-radius: 4px; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; font-size: 12px; transition: 0.2s; }
        .comp-btn:hover { border-color: var(--v5-color); background: #2a2a2a; }

        /* Setup Panels */
        .wire-setup { background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .color-picker { display: flex; gap: 10px; justify-content: center; }
        .color-opt { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-opt.selected { border-color: white; box-shadow: 0 0 8px white; }

        /* Workspace & Breadboard */
        #viewport { flex-grow: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 20px; position: relative; }
        .board-container { display: flex; flex-direction: column; align-items: flex-start; background: #111; padding: 30px; border-radius: 8px; width: fit-content; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.8); }

        /* Power Rails */
        .rails { display: flex; flex-direction: column; gap: 8px; }
        .rail { height: 24px; border-radius: 4px; font-size: 11px; display: flex; align-items: center; position: relative; width: 894px; }
        .rail-label { position: absolute; left: -50px; width: 45px; text-align: right; font-weight: bold; color: #aaa; }
        .rail-holes-grid { display: grid; grid-template-columns: repeat(10, 84px); gap: 6px; width: 100%; }
        .hole-group { display: flex; justify-content: space-around; padding: 0 8px; }
        
        /* Holes (Marked for Snapping) */
        .snappable-hole { width: 9px; height: 9px; background: #000; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); box-sizing: border-box; }
        .node .snappable-hole { border: 1px solid #333; } /* holes on breadboard */

        /* Breadboard Nodes */
        #board { display: grid; grid-template-columns: repeat(10, 84px); gap: 6px; padding: 20px 0; z-index: 10; }
        .node { width: 84px; height: 84px; background: var(--node-color); border-radius: 4px; position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 12px; padding: 12px; box-sizing: border-box; }
        .node-num { position: absolute; top: 2px; left: 4px; font-size: 9px; color: #555; pointer-events: none; }

        /* Droppable Components */
        .component { position: absolute; cursor: grab; z-index: 500; background-color: var(--comp-bg); border: 1px solid var(--comp-border); border-radius: 3px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 4px 8px rgba(0,0,0,0.4); transform-origin: center center; }
        .selected { border: 2.5px solid var(--v5-color) !important; box-shadow: 0 0 15px var(--v5-color); }
        .symbol-svg { stroke: var(--symbol-color); fill: none; stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }

        /* SVG Flex Jumpers */
        .flex-wire-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 400; }
        .flex-wire-path { pointer-events: auto; cursor: grab; }
        .flex-wire-path:active { cursor: grabbing; }

        /* Wire Handles & Icons */
        .wire-handle { position: absolute; width: 14px; height: 14px; background: rgba(255,255,255,0.2); border-radius: 50%; cursor: crosshair; z-index: 600; transform: translate(-50%, -50%); border: 1px solid rgba(255,255,255,0.4); }
        .wire-delete-icon { position: absolute; cursor: pointer; color: #ff4444; font-size: 16px; transform: translate(-50%, -50%); pointer-events: auto; z-index: 650; }

        /* Standard sizes for menu display */
        .size-s { width: 40px; height: 20px; }
        .size-m { width: 60px; height: 32px; }
        .size-l { width: 60px; height: 48px; }

        /* Taller fixed wire icon in menu - now WHITE */
        .white-wire-fixed-size { width: 55px; height: 15px; border-radius: 8px; background: #ffffff !important; box-shadow: 0 0 5px white; }

        .credits { margin-top: auto; padding-top: 10px; font-size: 11px; color: #ffa502; text-align: center; font-style: italic; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="color:var(--v5-color); margin:0; font-size: 18px;">UniTrain V9.5</h2>
        
        <div class="section-label">1. Jumper Wire (Flex)</div>
        <div class="wire-setup">
            <div class="color-picker">
                <div class="color-opt selected" style="background:#ff3e3e;" onclick="selectWireColor('#ff3e3e', this)"></div>
                <div class="color-opt" style="background:#1e90ff;" onclick="selectWireColor('#1e90ff', this)"></div>
            </div>
            <button class="comp-btn" style="background:var(--v5-color); color:black; font-weight:bold; justify-content:center;" onclick="spawnFlexWire()">Add Flex Jumper</button>
        </div>

        <div class="section-label">2. Components (Modules)</div>
        <button class="comp-btn" onclick="spawn('wire', 'white-wire-fixed-size')">White Wire (Static) <span style="background:white; width:15px; height:3px;"></span></button>
        <button class="comp-btn" onclick="spawn('resistor', 'size-m')">Resistor <span>[R]</span></button>
        <button class="comp-btn" onclick="spawn('lamp', 'size-m')">Lamp <span>(X)</span></button>
        <button class="comp-btn" onclick="spawn('led', 'size-m')">LED (Light Arrows) <span>☼►►</span></button>
        <button class="comp-btn" onclick="spawn('diode', 'size-m')">Diode <span>|>|</span></button>
        <button class="comp-btn" onclick="spawn('capacitor', 'size-m')">Capacitor <span>||</span></button>
        <button class="comp-btn" onclick="spawn('ldr', 'size-m')">LDR <span>[L]</span></button>
        <button class="comp-btn" onclick="spawn('bjt', 'size-l')">BJT (NPN) <span>⫝</span></button>
        <button class="comp-btn" onclick="spawn('mosfet', 'size-l')">MOSFET <span>⫤</span></button>

        <div style="margin-top: 10px; text-align: center;">
            <p style="font-size: 10px; color:#666;">R: Rotate Component | Del: Remove</p>
            <button class="comp-btn" style="width:100%; background:#411; justify-content:center; border:none;" onclick="location.reload()">Reset Board</button>
            <div class="credits">Designed by Abdelaziz Medhat</div>
        </div>
    </div>

    <div id="viewport">
        <div class="board-container" id="board-container">
            <svg class="flex-wire-svg" id="wire-canvas"></svg>

            <div class="rails" style="margin-bottom: 10px;">
                <div class="rail" style="background:var(--v15-color)"><span class="rail-label">+15V</span><div class="rail-holes-grid" id="grid-v15"></div></div>
                <div class="rail" style="background:var(--v5-color)"><span class="rail-label">+5V</span><div class="rail-holes-grid" id="grid-v5"></div></div>
            </div>

            <div id="board"></div>

            <div class="rails" style="margin-top: 10px;">
                <div class="rail" style="background:var(--gnd-color)"><span class="rail-label">GND</span><div class="rail-holes-grid" id="grid-gnd"></div></div>
                <div class="rail" style="background:var(--v15-color)"><span class="rail-label">-15V</span><div class="rail-holes-grid" id="grid-vn15"></div></div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('board-container');
        const wireCanvas = document.getElementById('wire-canvas');
        let selected = null;
        let activeHandle = null;
        let currentWireColor = '#ff3e3e';
        let snappableHoles = [];

        // Registry and Snapping
        function updateHoleRegistry() {
            snappableHoles = [];
            const containerRect = container.getBoundingClientRect();
            document.querySelectorAll('.snappable-hole').forEach(hole => {
                const rect = hole.getBoundingClientRect();
                snappableHoles.push({ x: rect.left - containerRect.left + rect.width / 2, y: rect.top - containerRect.top + rect.height / 2 });
            });
        }

        function findNearestHole(x, y) {
            let nearest = null;
            let minDst = 16;
            snappableHoles.forEach(hole => {
                let dst = Math.sqrt((x - hole.x)**2 + (y - hole.y)**2);
                if(dst < minDst) { minDst = dst; nearest = hole; }
            });
            return nearest;
        }

        // --- Flex Wire Logic ---
        function selectWireColor(color, el) {
            currentWireColor = color;
            document.querySelectorAll('.color-opt').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
        }

        function spawnFlexWire() {
            updateHoleRegistry();
            const wireId = 'flex_' + Date.now();
            
            // 1. Create the SVG Line
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("id", wireId);
            line.setAttribute("x1", 50); line.setAttribute("y1", 50);
            line.setAttribute("x2", 150); line.setAttribute("y2", 150);
            line.setAttribute("stroke", currentWireColor);
            line.setAttribute("stroke-width", "5");
            line.setAttribute("class", "flex-wire-path");
            wireCanvas.appendChild(line);

            // 2. Create the handles (endpoints)
            createHandle(wireId, 'start', 50, 50);
            createHandle(wireId, 'end', 150, 150);

            // 3. Create Delete Icon
            createWireDeleteIcon(wireId, 100, 100); 
        }

        function createHandle(id, type, x, y) {
            const h = document.createElement('div');
            h.className = 'wire-handle';
            h.style.left = x + 'px'; h.style.top = y + 'px';
            h.onmousedown = function(e) {
                e.stopPropagation();
                const move = (me) => {
                    const rect = container.getBoundingClientRect();
                    let mx = me.clientX - rect.left; let my = me.clientY - rect.top;
                    const near = findNearestHole(mx, my);
                    if(near) { mx = near.x; my = near.y; }
                    h.style.left = mx+'px'; h.style.top = my+'px';
                    const l = document.getElementById(id);
                    if(type==='start') { l.setAttribute('x1', mx); l.setAttribute('y1', my); }
                    else { l.setAttribute('x2', mx); l.setAttribute('y2', my); }
                    syncWireUI(id);
                };
                const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
                document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            };
            container.appendChild(h);
            h.dataset.owner = id;
        }

        // Delete Icon for Flexible Wires
        function createWireDeleteIcon(wireId, x, y) {
            const delIcon = document.createElement('div');
            delIcon.innerHTML = '🗑️'; //🗑️
            delIcon.className = 'wire-delete-icon';
            delIcon.dataset.owner = wireId;
            delIcon.style.left = x + 'px'; delIcon.style.top = y + 'px';
            delIcon.onclick = () => {
                document.getElementById(wireId)?.remove(); // SVG Line
                container.querySelectorAll(`[data-owner="${wireId}"]`).forEach(el => el.remove()); // Handles & Icon
            };
            container.appendChild(delIcon);
        }

        function syncWireUI(id) {
            const line = document.getElementById(id);
            const x1 = parseFloat(line.getAttribute('x1')), y1 = parseFloat(line.getAttribute('y1'));
            const x2 = parseFloat(line.getAttribute('x2')), y2 = parseFloat(line.getAttribute('y2'));
            const del = container.querySelector(`[data-owner="${id}"].wire-delete-icon`);
            if(del) { del.style.left = (x1+x2)/2+'px'; del.style.top = (y1+y2)/2+'px'; }
        }

        // --- Static Components Logic ---
        function spawn(type, sizeClass) {
            const el = document.createElement('div');
            el.className = `component ${type} ${sizeClass}`;
            el.dataset.rotate = "0";
            
            let svg = '';
            // --- TECHNICAL ICON UPDATE SECTION ---
            if(type==='resistor') svg='<svg class="symbol-svg" width="50" height="20"><polyline points="5,10 12,10 15,5 20,15 25,5 30,15 35,5 40,10 45,10"/></svg>';
            else if(type==='lamp') svg='<svg class="symbol-svg" width="40" height="30"><circle cx="20" cy="15" r="10"/><line x1="13" y1="8" x2="27" y2="22"/><line x1="27" y1="8" x2="13" y2="22"/></svg>';
            
            // --- LED UPDATE (NOW WITH 2 UP ARROWS) ---
            else if(type==='led') svg='<svg class="symbol-svg" width="45" height="25" viewBox="0 0 45 25"><line x1="5" y1="12" x2="35" y2="12"/><polygon points="15,6 25,12 15,18" fill="#f00"/><line x1="25" y1="6" x2="25" y2="18"/><line x1="18" y1="3" x2="23" y2="-3" stroke="red"/><line x1="23" y1="3" x2="28" y2="-3" stroke="red"/></svg>';
            
            else if(type==='diode') svg='<svg class="symbol-svg" width="40" height="20"><line x1="5" y1="10" x2="35" y2="10"/><polygon points="15,5 25,10 15,15" fill="#000"/><line x1="25" y1="5" x2="25" y2="15"/></svg>';
            else if(type==='capacitor') svg='<svg class="symbol-svg" width="40" height="20"><line x1="5" y1="10" x2="18" y2="10"/><line x1="18" y1="5" x2="18" y2="15"/><line x1="22" y1="5" x2="22" y2="15"/><line x1="22" y1="10" x2="35" y2="10"/></svg>';
            else if(type==='ldr') svg='<svg class="symbol-svg" width="50" height="25"><circle cx="25" cy="12" r="8"/><polyline points="18,12 21,9 24,15 27,9 30,12"/></svg>';
            else if(type==='bjt') svg='<svg class="symbol-svg" width="40" height="40"><line x1="10" y1="10" x2="10" y2="30" stroke-width="3"/><line x1="10" y1="20" x2="0" y2="20"/><line x1="10" y1="15" x2="25" y2="5"/><line x1="10" y1="25" x2="25" y2="35"/><polygon points="20,30 25,35 18,35" fill="#000"/></svg>';
            
            // --- MOSFET UPDATE ---
            else if(type==='mosfet') svg='<svg class="symbol-svg" width="40" height="40"><line x1="10" y1="10" x2="10" y2="30" stroke-width="3"/><line x1="15" y1="10" x2="15" y2="30" stroke-dasharray="4"/><line x1="0" y1="20" x2="10" y2="20"/><line x1="15" y1="10" x2="25" y2="10"/><line x1="15" y1="30" x2="25" y2="30"/><line x1="15" y1="20" x2="25" y2="20"/><polygon points="20,20 15,18 15,22" fill="#000"/></svg>';
            
            // --- FIXED WIRE IS NOW WHITE AND THICKER ---
            else if(type==='wire') svg='<svg class="symbol-svg" width="55" height="15" viewBox="0 0 55 15"><line x1="0" y1="7" x2="55" y2="7" stroke="white" stroke-width="7"/></svg>';

            el.innerHTML = svg;
            el.onmousedown = function(e) {
                if(selected) selected.classList.remove('selected');
                selected = el; el.classList.add('selected');
                let sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
                const move = (me) => { el.style.left = (me.clientX - sx)+'px'; el.style.top = (me.clientY - sy)+'px'; };
                const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
                document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            };
            container.appendChild(el);
            el.style.left = '100px'; el.style.top = '100px';
        }

        // Global Key handlers (Rotate, Remove)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if(selected) { selected.remove(); selected = null; }
            }
            if (selected && (e.code === 'KeyR' || e.key.toLowerCase() === 'r' || e.key === 'ق')) {
                let rot = (parseInt(selected.dataset.rotate) + 90) % 360;
                selected.dataset.rotate = rot; selected.style.transform = `rotate(${rot}deg)`;
                e.preventDefault();
            }
        });

        // Initialize board
        function createRailHoles(id) {
            const c = document.getElementById(id);
            for(let i=0; i<10; i++) {
                const g = document.createElement('div'); g.className = 'hole-group';
                for(let j=0; j<3; j++) g.appendChild(Object.assign(document.createElement('div'), {className:'snappable-hole'}));
                c.appendChild(g);
            }
        }

        function init() {
            ['grid-v15', 'grid-v5', 'grid-gnd', 'grid-vn15'].forEach(createRailHoles);
            for(let i=1; i<=70; i++) {
                const n = document.createElement('div'); n.className = 'node';
                n.innerHTML = `<span class="node-num">${i}</span>`;
                for(let h=0; h<9; h++) n.appendChild(Object.assign(document.createElement('div'), {className:'snappable-hole'}));
                document.getElementById('board').appendChild(n);
            }
            setTimeout(updateHoleRegistry, 500);
        }
        init();
    </script>
</body>
</html>
